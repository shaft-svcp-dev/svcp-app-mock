# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
  # main への push では公開しない。Actions 画面からの手動実行だけデプロイする
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # setup-node が入れる npm 10 は、他OS向け native binding を必須インストールして EBADPLATFORM になる。
      # package.json の packageManager (npm 11) は setup-node の後に有効化する。
      - run: corepack enable
      - run: corepack install
      - run: npm ci
      - run: npx nuxt build --preset github_pages
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
